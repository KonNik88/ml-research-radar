# Golden Set Expansion v2 labeling campaign.
# The file name is campaign-specific; the underlying config/report schema remains golden_labeling_v1.
# Seven query IDs replace existing weak-pattern-only rows after review; twelve query IDs are new.

schema_version: golden_labeling_v1
defaults:
  backend_mode: file
  modes:
  - lexical
  - dense
  - hybrid
  - hybrid_ranked
  top_k: 20
  max_candidates_per_query: 30
paths:
  output_dir: artifacts/reports/evaluation
  validation_output_dir: artifacts/reports/validation
queries:
- query_id: vision_language_models_001
  enabled: true
  group: multimodal
  query: vision language models
  intent: Find papers about vision-language models, multimodal LLMs, CLIP-like models, or visual instruction tuning.
  expected_terms:
    title_substrings:
    - vision
    must_have_any_terms:
    - vision-language
    - vision language
    - multimodal
    - clip
    - visual instruction
- query_id: reinforcement_learning_from_human_feedback_001
  enabled: true
  group: reinforcement_learning
  query: reinforcement learning from human feedback
  intent: Find papers about RLHF, preference optimization, or reinforcement learning from human feedback.
  expected_terms:
    title_substrings:
    - feedback
    must_have_any_terms:
    - rlhf
    - human feedback
    - preference
    - reinforcement learning
- query_id: efficient_transformers_001
  enabled: true
  group: efficient_ml
  query: efficient transformers
  intent: Find papers about efficient Transformer architectures, sparse attention, long-context efficiency, or memory-efficient
    attention.
  expected_terms:
    title_substrings:
    - transformer
    must_have_any_terms:
    - efficient transformer
    - sparse attention
    - linear attention
    - long context
    - memory efficient
- query_id: large_language_model_agents_001
  enabled: true
  group: agents_tooling
  query: large language model agents
  intent: Find papers about LLM agents, tool use, planning, or agentic workflows.
  expected_terms:
    title_substrings:
    - language model
    must_have_any_terms:
    - agent
    - agents
    - tool use
    - planning
    - large language model
- query_id: self_supervised_learning_001
  enabled: true
  group: representation_learning
  query: self supervised learning
  intent: Find papers about self-supervised representation learning, contrastive learning, SimCLR/BYOL-like approaches.
  expected_terms:
    title_substrings:
    - self-supervised
    must_have_any_terms:
    - self-supervised
    - self supervised
    - contrastive
    - simclr
    - byol
- query_id: neural_ordinary_differential_equations_001
  enabled: true
  group: deep_learning
  query: neural ordinary differential equations
  intent: Find papers about Neural ODEs or continuous-depth neural networks.
  expected_terms:
    title_substrings:
    - neural
    must_have_any_terms:
    - ordinary differential
    - neural ode
    - continuous-depth
    - differential equations
- query_id: explainable_ai_shap_001
  enabled: true
  group: interpretability
  query: explainable artificial intelligence SHAP
  intent: Find papers about explainable AI, interpretability, SHAP, feature attribution, or model explanations.
  expected_terms:
    title_substrings:
    - explain
    must_have_any_terms:
    - explainable
    - interpretability
    - shap
    - feature attribution
    - explanation
- query_id: parameter_efficient_fine_tuning_001
  enabled: true
  group: language_model_adaptation
  query: parameter efficient fine tuning large language models
  intent: Find papers about PEFT methods for language models, including LoRA, adapters, prompt tuning, or related efficient
    adaptation methods.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - parameter efficient fine tuning
    - peft
    - lora
    - adapter
    - prompt tuning
- query_id: long_context_language_models_001
  enabled: true
  group: efficient_ml
  query: long context language models efficient attention
  intent: Find papers about long-context language models, context-window extension, or efficient attention for long sequences.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - long context
    - context window
    - efficient attention
    - long sequence
    - memory efficient
- query_id: mixture_of_experts_language_models_001
  enabled: true
  group: language_model_architectures
  query: mixture of experts language models
  intent: Find papers about sparse or dense mixture-of-experts architectures for language models and expert routing.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - mixture of experts
    - moe
    - expert routing
    - sparse experts
    - language model
- query_id: llm_quantization_001
  enabled: true
  group: efficient_ml
  query: large language model quantization inference
  intent: Find papers about low-bit quantization, compression, or efficient inference for large language models.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - quantization
    - low bit
    - 4-bit
    - 8-bit
    - efficient inference
- query_id: code_generation_language_models_001
  enabled: true
  group: code_ml
  query: code generation large language models
  intent: Find papers about language models for code generation, program synthesis, code completion, or software engineering.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - code generation
    - program synthesis
    - code language model
    - code completion
    - software engineering
- query_id: graph_transformers_001
  enabled: true
  group: graph_ml
  query: graph transformers neural networks
  intent: Find papers about Transformer-style architectures for graph representation learning.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - graph transformer
    - graph attention
    - graph neural network
    - transformer
- query_id: time_series_transformers_001
  enabled: true
  group: time_series
  query: transformers for time series forecasting
  intent: Find papers about Transformer models for time-series forecasting or temporal representation learning.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - time series
    - forecasting
    - transformer
    - temporal
- query_id: neural_recommender_systems_001
  enabled: true
  group: recommender_systems
  query: neural recommender systems ranking
  intent: Find papers about neural recommendation, collaborative filtering, ranking, or deep recommender systems.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - recommender
    - recommendation
    - collaborative filtering
    - ranking
    - neural recommendation
- query_id: physics_informed_neural_networks_001
  enabled: true
  group: scientific_ml
  query: physics informed neural networks scientific machine learning
  intent: Find papers about physics-informed neural networks, scientific machine learning, or neural methods for differential
    equations.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - physics informed
    - pinn
    - scientific machine learning
    - differential equations
- query_id: language_model_alignment_001
  enabled: true
  group: language_model_alignment
  query: language model alignment preference optimization
  intent: Find papers about language-model alignment, preference optimization, DPO, reward modeling, or human-feedback alignment.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - alignment
    - preference optimization
    - dpo
    - reward model
    - human feedback
- query_id: federated_learning_privacy_001
  enabled: true
  group: privacy_ml
  query: federated learning privacy
  intent: Find papers about federated learning, privacy-preserving distributed learning, or secure aggregation.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - federated learning
    - privacy
    - distributed learning
    - secure aggregation
- query_id: causal_machine_learning_001
  enabled: true
  group: causal_ml
  query: causal machine learning treatment effects
  intent: Find papers about causal machine learning, treatment-effect estimation, counterfactual prediction, or causal inference.
  expected_terms:
    title_substrings: []
    must_have_any_terms:
    - causal inference
    - treatment effect
    - counterfactual
    - causal machine learning
thresholds:
  min_enabled_queries: 19
  min_modes_count: 4
  min_candidates_per_query: 5
  require_jsonl_templates: true
  require_markdown_sections: true
