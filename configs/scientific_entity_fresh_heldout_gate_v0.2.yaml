schema_version: scientific_entity_fresh_heldout_gate_v0.2

layer:
  name: scientific_entity_fresh_heldout_gate
  version: v0.2
  status: design_frozen
  layer_kind: independent_prediction_blind_acceptance_gate

candidate:
  candidate_id: scientific-entity-semantic-prompt-raw-floor-extension-v0.2c
  development_comparison_id: scientific-entity-semantic-prompt-raw-floor-comparison-v0.2c-20260830T110628936475Z
  development_policy_build_id: scientific-entity-semantic-prompt-raw-floor-policy-v0.2c-20260830T105318817514Z
  development_calibration_id: scientific-entity-semantic-prompt-raw-floor-calibration-v0.2c-20260830T104242195583Z
  raw_runtime_config_path: configs/scientific_entity_gliner_semantic_prompt_raw_floor_candidate_v0.2c.yaml
  policy_config_path: configs/scientific_entity_semantic_prompt_raw_floor_policy_v0.2c.yaml
  comparison_config_path: configs/scientific_entity_semantic_prompt_raw_floor_comparison_v0.2c.yaml
  raw_inference_floor: 0.40
  title_threshold: 0.45
  abstract_threshold: 0.625
  entity_type_overrides_allowed: false
  prompts_frozen: true
  model_revision_artifact_frozen: true
  adapter_windowing_frozen: true

development_exclusion:
  development_package_id: scientific-entity-semantic-prompt-development-v0.2a-20260829T140201009151Z
  expected_consumed_document_count: 72
  expected_consumed_reference_mention_count: 1316
  exclude_all_consumed_development_documents: true
  canonical_id_overlap_allowed: false
  previous_v01_heldout_is_consumed_development_for_v02: true

sampling:
  sampling_algorithm: deterministic_hash_uniform_and_type_enriched_v0.2
  sampling_seed: ml-research-radar-scientific-entity-fresh-heldout-v0.2
  canonical_input_path: data/analytics/reconciled/canonical_documents.jsonl
  require_title: true
  require_abstract: true
  uniform_document_count: 24
  type_enriched_documents_per_type: 4
  expected_document_count: 48
  expected_annotation_row_count: 96
  candidate_pool_per_stratum: 512
  source_fields:
    - title
    - abstract
  enrichment_terms:
    task:
      - classification
      - named entity recognition
      - machine translation
    method:
      - contrastive learning
      - transfer learning
      - naive Bayes
    dataset:
      - ImageNet
      - CIFAR-10
      - benchmark dataset
    metric:
      - F1 score
      - accuracy
      - BLEU
    model:
      - BERT
      - transformer model
      - language model
    domain:
      - medical imaging
      - natural language processing
      - computer vision

reference_freeze:
  annotation_method: manual_adjudicated
  annotation_guideline_version: scientific_entity_annotation_guidelines_v0.1
  prediction_blind: true
  annotations_initially_empty: true
  candidate_predictions_may_be_read_during_sampling: false
  candidate_predictions_may_be_read_during_annotation: false
  require_exact_sample_identity: true
  require_original_blank_template: true
  require_all_annotation_rows_complete: true
  require_zero_unresolved_uncertain_mentions: true
  minimum_reference_mentions_per_type: 20
  required_entity_types:
    - task
    - method
    - dataset
    - metric
    - model
    - domain
  candidate_inference_only_after_reference_freeze: true

acceptance:
  decision_role: independent_v02_candidate_acceptance_gate
  minimum_exact_f1: 0.396882
  exact_f1_floor_origin: independent_v01_heldout_exact_f1
  desirable_minimum_relaxed_f1: 0.414868
  relaxed_f1_floor_role: desirable_not_hard
  maximum_model_to_method_count: 43
  maximum_method_to_task_count: 25
  maximum_total_type_mismatch_count: 150
  maximum_method_semantic_sink_count: 74
  maximum_any_predicted_type_mismatch_sink_count: 74
  require_sample_adequacy: true
  require_exact_f1_hard_gate: true
  require_all_semantic_guardrails: true
  require_relaxed_f1_as_hard_gate: false
  no_post_heldout_tuning: true
  all_hard_gates_required_for_acceptance: true

decision_semantics:
  if_all_hard_gates_pass: accept_as_independently_validated_bounded_extractor_v0.2
  pass_does_not_select_production_extractor: true
  pass_does_not_authorize_full_corpus_build: true
  if_any_hard_gate_fails: reject_v02c_independent_acceptance
  failed_heldout_becomes_consumed_development_evidence: true
  future_candidate_after_failure_requires_new_independent_heldout: true
  heldout_may_not_be_reused_for_retuning_and_reacceptance: true

safety:
  contract_slice_selects_sample: false
  contract_slice_runs_model_inference: false
  contract_slice_runs_evaluation: false
  contract_slice_consumes_fresh_heldout: false
  sample_preparation_allowed_after_contract_freeze: true
  model_inference_allowed_before_reference_freeze: false
  threshold_tuning_allowed: false
  prompt_changes_allowed: false
  model_changes_allowed: false
  entity_type_changes_allowed: false
  canonical_truth_mutation_allowed: false
  reconcile_input_allowed: false
  provider_api_allowed: false
  production_extractor_selected: false
  full_corpus_build_authorized: false
  publication_allowed: false

next_steps:
  after_contract_freeze: materialize_prediction_blind_fresh_heldout_sample_v02
  after_sample_validation: prediction_blind_manual_annotation_and_reference_freeze
  after_reference_freeze: run_frozen_v02c_raw_inference_once
  after_raw_build_validation: apply_frozen_v02c_policy_once
  after_policy_validation: evaluate_frozen_v02c_against_frozen_fresh_references_once
  after_evaluation: immutable_accept_or_reject_decision_without_tuning
