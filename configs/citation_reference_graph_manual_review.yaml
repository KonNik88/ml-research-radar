schema_version: citation_reference_graph_manual_review_config_v1
review:
  name: citation_reference_graph_manual_review
  version: v0.1
  status: local_manual_review_gate
  graph_version: v0.1
  approval_state: approved
  manual_review_required: true
  manual_review_complete: true
  publication_ready: false
  publication_block_reason: publication_action_not_in_scope
  may_be_used_as_reconcile_input: false
  reviewer_role: project_owner_maintainer
  reviewed_at: '2026-07-16'
  decision_record: docs/citation_reference_graph_manual_review_decision_record_v0.1.md
  publication_purpose: non_commercial_educational_portfolio
  publication_targets:
  - kaggle_dataset
  - github_release
  - public_radar_website
  attribution_required: true
  redistributes_pdfs: false
  redistributes_full_text: false
inputs:
  line_checkpoint_report: artifacts/reports/validation/citation_reference_graph_line_checkpoint_latest.json
  package_manifest: data/graphs/citation_reference_graph/packages/v0.1/package_manifest.json
  package_report: artifacts/reports/validation/citation_reference_graph_package_latest.json
  release_candidate_report: artifacts/reports/validation/citation_reference_graph_release_candidate_latest.json
  inspection_report: artifacts/reports/validation/citation_reference_graph_inspection_latest.json
  decision_record: docs/citation_reference_graph_manual_review_decision_record_v0.1.md
validation:
  report_dir: artifacts/reports/validation
manual_review:
  status_policy:
    pending_blocks_publication: true
    pending_fails_validator: false
    approved_does_not_publish: true
  allowed_category_statuses:
  - pending
  - in_progress
  - passed
  - failed
  - not_applicable
  required_category_ids:
  - license_redistribution
  - source_provider_terms
  - reference_metadata_caveats
  - explicit_reference_fields_only
  - unresolved_external_reference_caveats
  - low_resolution_ratio_caveat
  - openalex_normalization_review
  - doi_reference_policy_review
  - source_family_reference_distribution_review
  - top_internal_referenced_papers_review
  - top_external_references_review
  - full_text_not_parsed_caveat
  - bibliography_not_parsed_caveat
  - package_manifest_checksum_review
  - readme_clarity
  - known_limitations
  - publication_target_decision
  - manual_approval_state
  categories:
  - id: license_redistribution
    title: License and redistribution status
    required: true
    status: passed
    reviewer_note: Passed for the intended non-commercial educational and portfolio scope. The graph package
      contains metadata/reference identifiers and derived graph evidence only; it does not redistribute
      PDFs or full text. Any future public release must preserve source-specific terms and attribution
      and remains a separate publication action.
  - id: source_provider_terms
    title: Source provider terms and citation metadata caveats
    required: true
    status: passed
    reviewer_note: Passed for the intended metadata-only, non-commercial, attribution-preserving scope
      after review of current official arXiv, OpenAlex, Crossref, Semantic Scholar, and ACL Anthology
      terms. Future public releases must retain source attribution and must not claim that all upstream
      data is owned by or uniformly licensed by Radar.
  - id: reference_metadata_caveats
    title: Reference metadata caveats
    required: true
    status: passed
    reviewer_note: Passed. The graph is explicitly documented as metadata-reference evidence only and
      not as a complete citation index or global bibliometric source.
  - id: explicit_reference_fields_only
    title: Explicit reference fields only
    required: true
    status: passed
    reviewer_note: Passed. v0.1 edges derive only from explicit canonical referenced_dois, referenced_ids,
      and referenced_arxiv_ids fields; no raw bibliography or full-text extraction is implied.
  - id: unresolved_external_reference_caveats
    title: Unresolved external-reference caveats
    required: true
    status: passed
    reviewer_note: Passed. Unresolved references are preserved as external_reference evidence nodes and
      are not represented as resolved publication-grade entities.
  - id: low_resolution_ratio_caveat
    title: Low resolution-ratio caveat
    required: true
    status: passed
    reviewer_note: Passed. reference_resolution_ratio=0.00869 is accepted as an explicit v0.1 coverage
      limitation, not a quality or completeness claim.
  - id: openalex_normalization_review
    title: OpenAlex normalization review
    required: true
    status: passed
    reviewer_note: Passed. Accepted evidence confirms OpenAlex references remain typed as openalex_id
      and are not mislabeled as DOI-like URL values.
  - id: doi_reference_policy_review
    title: DOI reference policy review
    required: true
    status: passed
    reviewer_note: Passed. DOI normalization and matching remain conservative; resolved paper links require
      accepted canonical identity evidence and must not collapse unrelated papers.
  - id: source_family_reference_distribution_review
    title: Source-family reference distribution review
    required: true
    status: passed
    reviewer_note: Passed. The source-family distribution was reviewed as reference-bearing provenance
      evidence only, not as complete provider coverage.
  - id: top_internal_referenced_papers_review
    title: Top internal referenced papers review
    required: true
    status: passed
    reviewer_note: Passed. Top internal rows are bounded diagnostics over resolved internal reference
      counts only and are not global citation metrics or publication-grade rankings.
  - id: top_external_references_review
    title: Top external references review
    required: true
    status: passed
    reviewer_note: Passed. Top external rows are bounded diagnostics over unresolved external-reference
      counts only and are not publication-grade reference entities or rankings.
  - id: full_text_not_parsed_caveat
    title: Full text not parsed caveat
    required: true
    status: passed
    reviewer_note: Passed. Citation Graph v0.1 does not parse or redistribute full text, PDFs, HTML bodies,
      or in-text citation contexts; users are directed to original publication sources.
  - id: bibliography_not_parsed_caveat
    title: Bibliography/reference sections not parsed caveat
    required: true
    status: passed
    reviewer_note: Passed. Citation Graph v0.1 does not parse bibliography/reference sections or raw reference
      strings without explicit metadata identifiers.
  - id: package_manifest_checksum_review
    title: Package manifest and checksum review
    required: true
    status: passed
    reviewer_note: Passed. The reviewed package manifest and package-validator evidence report matching
      checksums for the local candidate archive and included files.
  - id: readme_clarity
    title: README clarity
    required: true
    status: passed
    reviewer_note: Passed. The graph and package README files clearly state local derived/package-candidate
      status, metadata-only scope, non-canonical boundaries, no runtime/publication claim, and no full-text
      parsing.
  - id: known_limitations
    title: Known limitations
    required: true
    status: passed
    reviewer_note: Passed. Known limitations are visible in the package, evidence, API/runtime, and known-issues
      documentation and remain mandatory caveats for future public use.
  - id: publication_target_decision
    title: Publication target decision
    required: true
    status: passed
    reviewer_note: Passed. Intended future targets are a non-commercial Kaggle metadata/graph dataset,
      a GitHub release, and a public Radar discovery website with source attribution and links to originals.
      No publication or upload is performed by this review slice.
  - id: manual_approval_state
    title: Manual approval state
    required: true
    status: passed
    reviewer_note: Passed. The project owner/maintainer reviewed all 18 required categories and approved
      the checklist. This approval completes manual review only; publication remains a separate explicit
      action and publication_ready remains false.
expected_citation_reference_caveats:
  metadata_reference_fields_only: true
  full_text_parsed: false
  pdfs_parsed: false
  bibliography_sections_parsed: false
  raw_reference_strings_without_identifiers_parsed: false
  unresolved_references_preserved_as_external_reference_nodes: true
  reference_resolution_ratio: 0.00869
safety:
  read_only_manual_review: true
  rebuild_graph: false
  rebuild_package: false
  mutate_canonical_documents: false
  mutate_retrieval_artifacts: false
  mutate_qdrant: false
  mutate_postgres: false
  mutate_db_schema: false
  mutate_api: false
  mutate_ui: false
  mutate_ranking: false
  publish_dataset: false
  publish_graph: false
  create_latest_pointer: false
  create_graph_runtime: false
  require_networkx_runtime: false
  require_neo4j_runtime: false
  require_graphrag_runtime: false
  parse_full_text: false
  parse_pdfs: false
  parse_bibliography_sections: false
  may_be_used_as_reconcile_input: false
