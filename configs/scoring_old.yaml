retrieval:
  defaults:
    mode: "hybrid"
    top_k: 10
    max_top_k: 100

  text_fields:
    - title
    - abstract
    - authors
    - categories
    - tags

  hybrid:
    enabled: true
    normalization: "minmax"
    lexical_weight: 0.55
    dense_weight: 0.45

ranking:
  enabled: true

  weights:
    retrieval: 0.60
    recency: 0.20
    source_support: 0.10
    metadata_quality: 0.10

  recency:
    min_year: 2018
    max_year: 2026
    fallback_score: 0.50

  source_support:
    max_source_count_for_normalization: 3
    fallback_score: 0.50

  metadata_quality:
    title_weight: 0.30
    abstract_weight: 0.30
    authors_weight: 0.15
    year_weight: 0.10
    doi_weight: 0.05
    categories_weight: 0.10

debug:
  include_meta_by_default: true
  include_timing_by_default: true