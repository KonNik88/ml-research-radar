sources:
  enabled:
    - arxiv
    - openalex_alignment
    - semantic_scholar_alignment
    - crossref_alignment

  experimental:
    - paperswithcode_alignment

profiles:
  test:
    arxiv:
      search_query: "machine learning"
      max_results: 50
      sort_by: "submittedDate"
      sort_order: "descending"

    openalex:
      search: "machine learning"
      per_page: 50
      filter: "from_publication_date:2024-01-01"
      sort: "publication_date:desc"

  dev:
    arxiv:
      search_query: |
        cat:cs.LG OR cat:cs.AI OR cat:cs.CV OR cat:cs.CL OR cat:stat.ML
      max_results: 300
      sort_by: "submittedDate"
      sort_order: "descending"

    openalex:
      search: "machine learning"
      per_page: 300
      filter: "from_publication_date:2023-01-01"
      sort: "publication_date:desc"

  full:
    arxiv:
      search_query: |
        cat:cs.LG OR cat:cs.AI OR cat:cs.CV OR cat:cs.CL OR cat:stat.ML
      max_results: 1000
      sort_by: "submittedDate"
      sort_order: "descending"

    openalex:
      search: "machine learning"
      per_page: 1000
      filter: "from_publication_date:2022-01-01"
      sort: "publication_date:desc"

  medium_scale:
    arxiv:
      search_query: "cat:cs.LG OR cat:cs.AI OR cat:cs.CV OR cat:cs.CL OR cat:stat.ML"
      batch_size: 25
      sort_by: "submittedDate"
      sort_order: "descending"

  medium_scale_60k:
    description: "Controlled 60k arXiv backbone expansion from local Kaggle arXiv snapshot."
    safety_level: "candidate_first"
    arxiv:
      source_mode: "kaggle_snapshot"
      target_size: 60000
      limit: 60000
      min_year: 2018
      max_year: 2026
      require_abstract: true
      categories_mode: "explicit"
      categories:
        - cs.LG
        - cs.AI
        - cs.CV
        - cs.CL
        - stat.ML
        - cs.IR
        - cs.NE
        - cs.RO
        - eess.AS
        - eess.IV
      include_cross_listed_categories: true
      report_every: 5000
      persist_raw: true
      output_semantics:
        normalized_snapshot: "timestamped full arxiv normalized snapshot"
        latest_policy: "do not treat as trusted canonical state until candidate reconcile + validation + promotion"

    enrichment:
      enabled_sources:
        - openalex_alignment
        - semantic_scholar_alignment
        - crossref_alignment
      policy: "run aligned enrichment after arxiv backbone expansion; use explicit full merged snapshots for reconcile"
      notes:
        - "Do not reconcile against selective/latest alignment batches directly."
        - "Merge selective enrichment outputs into full alignment snapshots before downstream reconcile."

    downstream:
      reconcile: "candidate_only_first"
      export_postgres: "after_promotion_only"
      artifact_extraction: "after_promotion_only"
      retrieval_rebuild: "after_promotion_only"
      dod_required:
        - artifacts
        - github_enrichment

defaults:
  profile: "dev"
  deduplicate_after_ingest: true
  run_reconcile: true

limits:
  hard_max_results_per_source: 100000
  recommended_test_corpus_size: 100
  recommended_dev_corpus_size: 300
  recommended_full_corpus_size: 1000
  recommended_medium_scale_corpus_size: 60000
